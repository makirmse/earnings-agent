[project]
name = "earnings-agent"
version = "0.1.0"
description = "Download SEC filings, earnings presentations, and call transcripts for public companies."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8.1",
]

[project.scripts]
earnings-agent = "earnings_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earnings_agent*"]
